name: Build desktop and Android packages

on:
  push:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform package to build
        required: true
        type: choice
        default: all
        options:
          - all
          - windows-x86_64
          - windows-arm64
          - android-arm64
          - linux-x86_64
          - linux-arm64
          - darwin-arm64

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    if: >-
      github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.platform != 'all') && format('["{0}"]', inputs.platform) || '["windows-x86_64","windows-arm64","android-arm64","linux-x86_64","linux-arm64","darwin-arm64"]') }}
    runs-on: ${{ matrix.platform == 'windows-x86_64' && 'windows-latest' || matrix.platform == 'windows-arm64' && 'windows-11-arm' || matrix.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || matrix.platform == 'darwin-arm64' && 'macos-15' || 'ubuntu-latest' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install Flutter
        if: matrix.platform != 'linux-arm64' && matrix.platform != 'windows-arm64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install Flutter on ARM64 hosts
        if: matrix.platform == 'linux-arm64' || matrix.platform == 'windows-arm64'
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          flutter --version

      - name: Install Android SDK and NDK
        if: matrix.platform == 'android-arm64'
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "ndk;28.2.13676358"

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      - name: Build Windows package
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          flutter pub get
          New-Item -ItemType Directory -Force build/package | Out-Null
          $env:GOOS = 'windows'
          $arch = '${{ endsWith(matrix.platform, 'x86_64') && 'amd64' || 'arm64' }}'
          $env:GOARCH = $arch
          $env:CGO_ENABLED = '0'
          Push-Location core
          go build -trimpath -ldflags='-s -w' -o ../build/package/tailtap-core.exe ./cmd/tailtap
          Pop-Location
          flutter build windows --release
          $windowsArch = if ($arch -eq 'arm64') { 'arm64' } else { 'x64' }
          $bundle = "build/windows/$windowsArch/runner/Release"
          Copy-Item build/package/tailtap-core.exe $bundle
          $version = (Select-String '^version:' pubspec.yaml).Line.Split(':', 2)[1].Trim().Split('+')[0]
          $archive = "tailtap_${version}_windows_$arch.zip"
          Compress-Archive -Path "$bundle\*" -DestinationPath "build/$archive"
          "PACKAGE=$archive" >> $env:GITHUB_ENV

      - name: Build Android package
        if: matrix.platform == 'android-arm64'
        shell: bash
        run: |
          flutter pub get
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" sh scripts/build-android-core.sh arm64-v8a
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          version="$(awk '/^version:/ { sub(/^version:[[:space:]]*/, ""); sub(/\+.*/, ""); print; exit }' pubspec.yaml)"
          archive="tailtap_${version}_android_arm64.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "build/$archive"
          echo "PACKAGE=$archive" >> "$GITHUB_ENV"

      - name: Build Linux package
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          if [[ '${{ matrix.platform }}' == *arm64 ]]; then arch=arm64; desktopArch=arm64; flutterPlatform=linux-arm64; else arch=amd64; desktopArch=x86_64; flutterPlatform=linux-x64; fi
          ./scripts/build-desktop.sh --release --$desktopArch
          version="$(awk '/^version:/ { sub(/^version:[[:space:]]*/, ""); sub(/\+.*/, ""); print; exit }' pubspec.yaml)"
          bundle="build/linux/${flutterPlatform#linux-}/release/bundle"
          archive="tailtap_${version}_linux_${arch}.tar.gz"
          tar -czf "build/$archive" -C "$bundle" .
          echo "PACKAGE=$archive" >> "$GITHUB_ENV"

      - name: Build macOS package
        if: matrix.platform == 'darwin-arm64'
        shell: bash
        run: |
          ./scripts/build-desktop.sh --release --arm64
          version="$(awk '/^version:/ { sub(/^version:[[:space:]]*/, ""); sub(/\+.*/, ""); print; exit }' pubspec.yaml)"
          archive="tailtap_${version}_darwin_arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/TailTap.app "build/$archive"
          echo "PACKAGE=$archive" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: build/${{ env.PACKAGE }}
          if-no-files-found: error
          retention-days: 30
